<!doctype html>
<html lang="zh-CN" data-theme="dark" data-glass="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a10" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Asteria Player — a Fluent Design web player for music and video with liquid glass surfaces, synchronized lyrics, subtitles and danmaku." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%2377e8e0'/%3E%3Cstop offset='1' stop-color='%236f7dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230b101b'/%3E%3Ccircle cx='32' cy='32' r='21' fill='url(%23g)' opacity='.18'/%3E%3Cpath d='M32 12 47 48h-7l-3-7H27l-3 7h-7L32 12zm0 14-4 10h8l-4-10z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Asteria" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Asteria Player</title>
    <script>
      // Apply the saved theme before first paint to avoid a bright flash.
      try {
        var saved = JSON.parse(localStorage.getItem('asteria-settings') || '{}').state || {};
        var choice = saved.theme || 'system';
        var dark = choice === 'dark' || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.glass = saved.liquidGlass === false ? 'off' : 'on';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
