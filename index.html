<!doctype html>
<html lang="zh-CN" data-theme="dark" data-glass="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a10" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Asteria Player — a Fluent Design web player for music and video with liquid glass surfaces, synchronized lyrics, subtitles and danmaku." />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Asteria" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Asteria Player</title>
    <script>
      // Apply the saved theme before first paint to avoid a bright flash.
      try {
        var saved = JSON.parse(localStorage.getItem('asteria-settings') || '{}').state || {};
        var choice = saved.theme || 'system';
        var dark = choice === 'dark' || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.glass = saved.liquidGlass === false ? 'off' : 'on';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (error) {}
    </script>
    <script>
      // Start the locale request while the module graph is still downloading.
      try {
        var settings = JSON.parse(localStorage.getItem('asteria-settings') || '{}').state || {};
        var pref = settings.language || 'system';
        var builtIn = { 'zh-CN': 1, 'zh-TW': 1, en: 1, ja: 1 };
        if (pref === 'system') {
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
          pref = 'en';
          for (var i = 0; i < langs.length; i += 1) {
            var tag = String(langs[i]).toLowerCase();
            if (tag.indexOf('zh') === 0) { pref = /hant|tw|hk|mo/.test(tag) ? 'zh-TW' : 'zh-CN'; break; }
            if (tag.indexOf('en') === 0) { pref = 'en'; break; }
            if (tag.indexOf('ja') === 0) { pref = 'ja'; break; }
          }
        }
        if (builtIn[pref]) {
          var locale = document.createElement('link');
          locale.rel = 'preload';
          locale.as = 'fetch';
          locale.type = 'application/json';
          locale.crossOrigin = 'anonymous';
          var update = new URLSearchParams(location.search).get('__update');
          locale.href = 'locales/' + pref + '.json' + (update ? '?__update=' + encodeURIComponent(update) : '');
          locale.setAttribute('fetchpriority', 'high');
          document.head.appendChild(locale);
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
